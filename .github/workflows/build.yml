# Builds the add-on on every push and pull request. The installable files are
# attached to each run as the "ConstructionMachines-<version>" artifact.
name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build packs
        run: npm run build
      - name: Validate packs
        run: npm run validate
      - name: Unit tests
        run: npm test
      - name: Package .mcaddon and .mcpack files
        run: npm run package
      - name: Render previews
        run: npm run preview
      - uses: actions/upload-artifact@v7
        with:
          name: ConstructionMachines-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
      - name: Build website
        run: npm run site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site/
      - uses: actions/upload-artifact@v7
        with:
          name: previews
          path: build/preview/
      - uses: actions/upload-artifact@v7
        with:
          name: packs
          path: |
            build/behavior_pack/
            build/resource_pack/
            package.json

  server-test:
    # Loads the packs into a Bedrock Dedicated Server and summons every machine.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packs
          path: build-artifact
      - run: mkdir -p build && cp -R build-artifact/build/* build/
      - name: Bedrock Dedicated Server smoke test
        run: tools/bds-test.sh

  java:
    # Java edition: generate resources from the shared specs, build the Fabric mod, run its game tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build and run game tests
        working-directory: java
        run: ./gradlew --no-daemon build runGameTest
      - uses: actions/upload-artifact@v7
        with:
          name: ConstructionMachines-fabric
          path: java/build/libs/*.jar
          if-no-files-found: error

  pages:
    # Publishes the website from main once the server test passes.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, server-test, java]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
